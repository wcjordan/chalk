name: Unit Tests
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: server/dev-requirements.txt

    - name: Install dependencies
      run: pip install -r dev-requirements.txt

    - name: Load environment
      run: |
        grep -v "^#" ../.env_default | grep -v "^$" >> $GITHUB_ENV
        echo "DOMAIN=localhost" >> $GITHUB_ENV
        echo "SECRET_KEY=testkey" >> $GITHUB_ENV

    - name: Run tests
      run: make test-inner

  test-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/js

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'yarn'
        cache-dependency-path: ui/js/yarn.lock

    - name: Install dependencies
      run: yarn install --immutable

    - name: Lint
      run: yarn eslint --max-warnings=0 .

    - name: Typecheck
      run: yarn tsc

    - name: Unit tests
      run: yarn jest

  test-storybook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/js

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'yarn'
        cache-dependency-path: ui/js/yarn.lock

    - name: Install dependencies
      run: yarn install --immutable

    - name: Build storybook
      run: STORYBOOK_TEST_ENV=true npx storybook build --test --quiet

    - name: Serve and test storybook
      run: |
        npx http-server -p 9009 storybook-static &
        npx wait-on http://127.0.0.1:9009
        npx test-storybook --no-index-json --url http://127.0.0.1:9009
